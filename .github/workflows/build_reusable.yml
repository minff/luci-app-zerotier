name: Build OpenWrt Package

on:
  workflow_call:
    inputs:
      openwrt_branch:
        description: "OpenWrt branch to build (e.g., openwrt-23.05, master, lede-17.01)"
        required: true
        default: "lede-17.01"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository into OpenWrt tree
        uses: actions/checkout@v4
        with:
          path: openwrt/feeds/luci/applications/luci-app-zerotier
          fetch-depth: 1

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            subversion g++ zlib1g-dev build-essential git python3 \
            libncurses5-dev gawk gettext unzip file libssl-dev wget

      - name: Cache OpenWrt downloads (dl)
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ inputs.openwrt_branch }}-${{ runner.os }}

      - name: Cache OpenWrt toolchain build
        uses: actions/cache@v4
        with:
          path: |
            openwrt/build_dir
            openwrt/staging_dir
          key: toolchain-${{ inputs.openwrt_branch }}-${{ runner.os }}
          restore-keys: |
            toolchain-${{ inputs.openwrt_branch }}-
            toolchain-

      - name: Clone OpenWrt sources
        run: |
          git clone --depth 1 --branch "${{ inputs.openwrt_branch }}" https://github.com/openwrt/openwrt.git

      - name: Prepare OpenWrt feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add luci-app-zerotier package feed
        working-directory: openwrt
        run: |
          # feeds applications update
          ./scripts/feeds update luci-app-zerotier
          ./scripts/feeds install luci-app-zerotier

      - name: Configure (defconfig)
        working-directory: openwrt
        run: |
          make defconfig

      - name: Build luci-app-zerotier package
        working-directory: openwrt
        run: |
          make package/luci-app-zerotier/clean V=s || true
          make package/luci-app-zerotier/compile -j"$(nproc)" V=s

      # - name: Collect luci-app-zerotier .ipk artifacts
      #   id: collect
      #   shell: bash
      #   working-directory: openwrt
      #   run: |
      #     echo "Searching for generated .ipk files..."
      #     # Find all zerotier IPKs in bin/packages paths
      #     mapfile -t files < <(find bin/packages -type f -name "*zerotier*ipk" 2>/dev/null || true)
      #     if [ ${#files[@]} -eq 0 ]; then
      #       echo "No zerotier .ipk files found in bin/packages/. Build may have failed or target not configured." >&2
      #     else
      #       printf "%s\n" "Found the following packages:" >&2
      #       printf "  - %s\n" "${files[@]}" >&2
      #     fi

      - name: Upload artifacts (.ipk)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-ipk-${{ inputs.openwrt_branch }}
          path: |
            openwrt/bin/packages/**/*.ipk
          if-no-files-found: warn
